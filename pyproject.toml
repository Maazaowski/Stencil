[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stencil"
version = "0.1.0"
description = "AI invoice extraction layer for Temforce"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pymysql>=1.1.0",
    "cryptography>=44.0.0",
    "bcrypt>=4.2.0",
    "celery[redis]>=5.4.0",
    "redis[hiredis]>=5.0.0",
    "watchdog>=6.0.0",
    "openai>=1.82.0",
    "anthropic>=0.69.0",
    "openpyxl>=3.1.5",
    "PyMuPDF>=1.25.0",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.18",
    "httpx>=0.28.0",
    "xlrd>=2.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stencil"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Deterministic suites (unit tests + corpus fingerprint/extraction) run by
# default on every change. AI authoring e2e is opt-in: pytest -m authoring
addopts = "-m 'not authoring'"
markers = [
    "authoring: AI-dependent model authoring end-to-end tests (needs OpenAI key; run with -m authoring)",
]

[tool.mypy]
python_version = "3.12"
strict = true
