# ── Stencil — DEV overlay ────────────────────────────
# Adds a local MySQL container and repoints backend/worker/watcher at it, so a
# developer machine needs no production database. Apply ON TOP of the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# The base docker-compose.yml alone is PRODUCTION (uses ST_DATABASE_URL from .env).
# ──────────────────────────────────────────────────────────

services:
  # ── Local MySQL (dev only) ──
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-stencil}
      MYSQL_DATABASE: stencil
      MYSQL_USER: stencil
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-stencil}
    ports:
      # Exposed so you can inspect the dev DB from the host (e.g. a SQL client).
      # Host side is 3307 because a native Windows MySQL service holds 3306.
      # Only affects host access -- the app containers reach MySQL at mysql:3306
      # over the compose network regardless.
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Point the app at the local MySQL and wait for it to be healthy. These
  # ST_DATABASE_URL values override the base file's production value.
  backend:
    environment:
      ST_DATABASE_URL: mysql+pymysql://stencil:${MYSQL_PASSWORD:-stencil}@mysql:3306/stencil
    volumes:
      # Replace the production /mnt/c bind by destination when Compose merges
      # this overlay. Docker Desktop then receives a native Windows host path.
      - ${ST_HOST_DATA_DIR:-C:\Stencil}/Invoices:/data/Invoices
    depends_on:
      mysql:
        condition: service_healthy

  worker:
    environment:
      ST_DATABASE_URL: mysql+pymysql://stencil:${MYSQL_PASSWORD:-stencil}@mysql:3306/stencil
    volumes:
      - ${ST_HOST_DATA_DIR:-C:\Stencil}/Invoices:/data/Invoices
    depends_on:
      mysql:
        condition: service_healthy

  watcher:
    environment:
      ST_DATABASE_URL: mysql+pymysql://stencil:${MYSQL_PASSWORD:-stencil}@mysql:3306/stencil
    volumes:
      - ${ST_HOST_DATA_DIR:-C:\Stencil}/Invoices:/data/Invoices
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
